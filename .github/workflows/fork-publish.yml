name: Build original Bambuddy fork
on:
  push:
    branches: [main, restore-original]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx vitest run src/__tests__/components/Layout.test.tsx
        working-directory: frontend
      - run: docker build -t bambuddy:restore-test .
  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version without importing application
        id: version
        run: |
          python - <<'PY'
          import ast, os
          tree = ast.parse(open('backend/app/core/config.py').read())
          version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'APP_VERSION' for t in n.targets))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag={version}\n')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            avalanche208/bambuddy:latest
            avalanche208/bambuddy:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
