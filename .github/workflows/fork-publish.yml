name: Build original Bambuddy fork
on:
  push:
    branches: [main, restore-original, preview-camera-update]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx vitest run src/__tests__/components/Layout.test.tsx src/__tests__/components/CameraTile.test.tsx src/__tests__/components/PrinterCardPreview.test.tsx
        working-directory: frontend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - name: Verify MQTT parsing and background calibration guards
        run: PYTHONPATH=. python -m pytest -c /dev/null --noconftest backend/tests/unit/services/test_bambu_mqtt.py backend/tests/unit/services/test_kprofile_drift_3219.py backend/tests/unit/services/test_kprofile_nozzle_buckets_2854.py backend/tests/unit/test_fts_kprofile_routing.py backend/tests/unit/services/test_fork_background_backup.py -q
      - name: Verify inventory assignment and guarded deferred replay
        run: PYTHONPATH=. python -m pytest backend/tests/integration/test_inventory_assign.py -q
      - run: docker build -t bambuddy:restore-test .
      - name: Verify fork update source and version ordering in image
        run: |
          docker run --rm --entrypoint python bambuddy:restore-test -c 'from backend.app.api.routes.updates import GITHUB_REPO, parse_version, is_newer_version; assert GITHUB_REPO == "avalanche208/bambuddy"; assert parse_version("1.2.5.7-fork.2026.10.3.1h")[4] == 0; assert is_newer_version("1.2.5.7-fork.2026.10.3.1h", "1.2.5.7-fork.2026.10.3.1g"); assert not is_newer_version("1.2.5.7-fork.2026.10.3.1g", "1.2.5.7-fork.2026.10.3.1h")'
  publish:
    if: github.ref == 'refs/heads/main'
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version without importing application
        id: version
        run: |
          python - <<'PY'
          import ast, os
          tree = ast.parse(open('backend/app/core/config.py').read())
          version = next(ast.literal_eval(n.value) for n in tree.body if isinstance(n, ast.Assign) and any(isinstance(t, ast.Name) and t.id == 'APP_VERSION' for t in n.targets))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'tag={version}\n')
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            avalanche208/bambuddy:latest
            avalanche208/bambuddy:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Publish fork release after Docker push
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Bambuddy $RELEASE_TAG" --notes-file FORK-RELEASE.md --latest
          fi
