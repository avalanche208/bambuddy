name: Review upstream updates
on:
  schedule:
    - cron: '0 8 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: upstream-monitor-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Fetch official upstream
        run: git fetch https://github.com/maziggy/bambuddy.git main:refs/remotes/upstream/main
      - name: Prepare safe candidates and review report
        id: prepare
        run: |
          python scripts/sync_upstream.py
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate the Docker build
        id: docker
        if: steps.prepare.outputs.changed == 'true'
        continue-on-error: true
        run: docker build -t bambuddy-monitor:upstream-review .
      - name: Record Docker build result
        if: always() && steps.prepare.outputs.changed == 'true'
        env:
          DOCKER_RESULT: ${{ steps.docker.outcome }}
        run: |
          if [ -d docs/upstream-review ]; then
            printf '\nDocker build: %s\n' "$DOCKER_RESULT" >> docs/upstream-review/checks.txt
          fi
      - name: Open or update draft review PR
        if: steps.prepare.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: review/upstream-monitor
          base: main
          title: 'Review upstream telemetry and camera updates'
          commit-message: 'Prepare upstream monitoring update for review'
          draft: true
          delete-branch: true
          body: |
            Upstream changes have been checked against the retained read-only files.
            Docker build result: ${{ steps.docker.outcome }}.

            Read `docs/upstream-review/README.md` and `checks.txt` before merging. Failed source candidates are reverted; conflicts and unrelated new features require manual porting. This PR never enables printer controls, merges itself, or deploys an image automatically.

            PRs made by GITHUB_TOKEN do not automatically trigger another workflow run. The sync workflow runs the tests and Docker build itself; check its results and rerun validation after manual edits.
