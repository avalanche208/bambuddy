services:
  bambuddy:
    build: .
    image: avalanche208/bambuddy:latest
    container_name: bambuddy
    ports:
      - "8000:8000"
    environment:
      BAMBUDDY_USERNAME: ${BAMBUDDY_USERNAME:-admin}
      BAMBUDDY_PASSWORD: ${BAMBUDDY_PASSWORD:-}
      TZ: America/Chicago
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - bambuddy_data:/app/data
      - bambuddy_logs:/app/logs
    restart: unless-stopped

volumes:
  bambuddy_data:
  bambuddy_logs:
