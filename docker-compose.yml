services:
  bambuddy-monitor:
    build: .
    image: bambuddy-monitor:local
    container_name: bambuddy-monitor
    ports:
      - "8000:8000"
    environment:
      BAMBUDDY_USERNAME: ${BAMBUDDY_USERNAME:-admin}
      BAMBUDDY_PASSWORD: ${BAMBUDDY_PASSWORD:?Set BAMBUDDY_PASSWORD in .env}
      TZ: America/Chicago
    volumes:
      - ./data:/data
    restart: unless-stopped
